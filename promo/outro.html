<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>방들이 아웃트로 (홍보 촬영용)</title>
    <!-- 홍보 영상 마지막 화면. 배포에 포함되지 않는다 (개발 서버에서 /promo/outro.html, window.play()로 시작) -->
    <style>
      @font-face {
        font-family: Galmuri11;
        font-weight: 400;
        src: url('/src/assets/fonts/Galmuri11.woff2') format('woff2');
      }
      @font-face {
        font-family: Galmuri11;
        font-weight: 700;
        src: url('/src/assets/fonts/Galmuri11-Bold.woff2') format('woff2');
      }
      :root {
        --bg: #dfe9f7;
        --ink: #2b2233;
        --accent: #ff7f2a;
        --soft: #fff3b0;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        height: 100%;
        overflow: hidden;
      }
      body {
        display: grid;
        place-items: center;
        background-color: var(--bg);
        background-image:
          linear-gradient(rgba(43, 34, 51, 0.06) 1px, transparent 1px),
          linear-gradient(90deg, rgba(43, 34, 51, 0.06) 1px, transparent 1px);
        background-size: 24px 24px;
        font-family: Galmuri11, system-ui, sans-serif;
        color: var(--ink);
      }
      .stack {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 14px;
        margin-top: -40px;
        text-align: center;
      }
      .house {
        width: 128px;
        height: 128px;
        image-rendering: pixelated;
      }
      .eyebrow {
        margin: 0;
        padding: 5px 14px;
        background: var(--soft);
        border: 2px solid var(--ink);
        border-radius: 999px;
        font-size: 15px;
      }
      .logo {
        margin: 2px 0 4px;
        font-size: 78px;
        font-weight: 700;
        line-height: 1;
        color: var(--accent);
        letter-spacing: 0.04em;
        text-shadow:
          4px 4px 0 var(--ink),
          -2px -2px 0 var(--ink),
          2px -2px 0 var(--ink),
          -2px 2px 0 var(--ink);
      }
      .lead {
        margin: 0;
        font-size: 17px;
        line-height: 1.6;
      }
      .url {
        margin-top: 10px;
        padding: 9px 20px;
        background: var(--accent);
        color: #fff;
        border: 2px solid var(--ink);
        border-radius: 12px;
        box-shadow: 3px 3px 0 var(--ink);
        font-size: 17px;
        font-weight: 700;
      }
      /* 차례로 톡 나타나기 (play 전에는 숨김) */
      .in {
        opacity: 0;
      }
      .go .in {
        animation: pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards;
        animation-delay: var(--d);
      }
      @keyframes pop {
        from {
          opacity: 0;
          transform: translateY(14px) scale(0.85);
        }
        to {
          opacity: 1;
          transform: none;
        }
      }
      .go .house {
        animation:
          pop 0.5s cubic-bezier(0.34, 1.56, 0.64, 1) forwards,
          hop 1.2s ease-in-out 0.9s infinite;
        animation-delay: var(--d), 1s;
      }
      @keyframes hop {
        0%,
        100% {
          transform: none;
        }
        50% {
          transform: translateY(-6px);
        }
      }
    </style>
  </head>
  <body>
    <div class="stack" id="stack">
      <img class="house in" style="--d: 0.15s" src="/favicon.svg" alt="" />
      <p class="eyebrow in" style="--d: 0.45s">친구들이 놀러 오는 미니룸</p>
      <h1 class="logo in" style="--d: 0.65s">방들이</h1>
      <p class="lead in" style="--d: 1s">내 방 링크 보내면<br />친구들이 놀러 와요</p>
      <div class="url in" style="--d: 1.3s">bangdeuri.com</div>
    </div>
    <script>
      window.done = false
      window.play = () => {
        document.getElementById('stack').classList.add('go')
        setTimeout(() => (window.done = true), 3600)
      }
    </script>
  </body>
</html>
